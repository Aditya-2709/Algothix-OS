set default=0
set timeout=5

if loadfont /boot/grub/font.pf2 ; then
    set gfxmode=auto
    insmod efi_gop
    insmod efi_uga
    insmod gfxterm
    terminal_output gfxterm
fi

set menu_color_normal=cyan/black
set menu_color_highlight=white/blue

menuentry "Algothix OS (ALX) Lite — Live Console" {
    linux /live/vmlinuz boot=live components hostname=alx username=alx console=tty0 console=ttyS0,115200n8
    initrd /live/initrd.img
}

menuentry "Algothix OS (ALX) Lite — Safe Graphics (nomodeset)" {
    linux /live/vmlinuz boot=live components hostname=alx username=alx nomodeset console=tty0 console=ttyS0,115200n8
    initrd /live/initrd.img
}
