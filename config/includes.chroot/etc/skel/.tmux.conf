# Algothix OS (ALX) Lite — tmux configuration (FR-3.3)

# Use Ctrl+a prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Fast escape for Neovim
set -sg escape-time 10
set -g history-limit 10000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g default-terminal "screen-256color"

# Intuitive splits preserving current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

setw -g mode-keys vi
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Minimal ALX dark status bar
set -g status-style "bg=#0f172a,fg=#e2e8f0"
set -g status-left "#[bg=#38bdf8,fg=#0f172a,bold] ALX #S #[default] "
set -g status-right "#[fg=#94a3b8]%H:%M %Y-%m-%d"
setw -g window-status-current-style "bg=#1e293b,fg=#38bdf8,bold"
