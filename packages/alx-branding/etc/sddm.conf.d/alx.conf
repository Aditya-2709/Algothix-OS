# Algothix OS (ALX) Lite — SDDM X11-only Configuration (CHANGE-001)
# Autologin is intentionally OFF for installed systems.
# Live ISO autologin is configured separately via 99-alx-live-autologin.conf
# and removed post-install by Calamares.

[General]
DisplayServer=x11
GreeterEnvironment=QT_QUICK_BACKEND=software

[Theme]
Current=alx
Font=JetBrains Mono

[X11]
ServerArguments=-nolisten tcp
