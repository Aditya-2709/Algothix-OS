---
# Algothix OS (ALX) Lite — Guided ext4-only partitioning (FR-6.2)
# enableLuksAutomatedPartitioning is dynamically updated by alx-calamares-launch
# based on CPU AES-NI hardware support.

efiSystemPartition: "/boot/efi"
efiSystemPartitionSize: 300M
userSwapChoices:
  - none
  - file

drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: true
initialPartitioningChoice: erase
initialSwapChoice: none

defaultFileSystemType: "ext4"
availableFileSystemTypes:
  - "ext4"

enableLuksAutomatedPartitioning: false
allowZfsEncryption: false
