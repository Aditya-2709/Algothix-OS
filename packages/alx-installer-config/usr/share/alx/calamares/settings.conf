---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
  - id:       alx-firstboot
    module:   shellprocess
    config:   shellprocess-alx-firstboot.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      - bootloader
      - shellprocess@alx-firstboot
      - umount
  - show:
      - finished

branding: alx
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
