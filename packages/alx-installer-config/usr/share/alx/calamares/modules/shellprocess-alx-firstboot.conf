---
# Algothix OS (ALX) Lite — Post-install target setup (FR-6.3, CHANGE-001)
# Remove live-only SDDM autologin, enable first-boot alx-tune, and purge Calamares.
dontChroot: false
timeout: 120
script:
  - "rm -f /etc/sddm.conf.d/99-alx-live-autologin.conf"
  - "rm -f /etc/alx/profile /etc/alx/hardware.env"
  - "systemctl enable alx-tune.service || true"
  - "apt-get purge -y calamares calamares-settings-debian alx-installer-config || true"
  - "apt-get autoremove -y || true"
